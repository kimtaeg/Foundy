name: "✨ 기능"
description: MVP 기능 추가·개선
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `docs/mvp.md`의 Must 항목이 끝나기 전에는 로그인·상권 분석·다른 업종 같은 범위 밖 기능을 만들지 않습니다.
        브랜치명: `feat/#이슈번호-기능명`

  - type: dropdown
    id: priority
    attributes:
      label: MVP 우선순위
      options:
        - Must
        - Should
        - Could
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: 작업 영역
      options:
        - label: frontend
        - label: backend / agent
        - label: backend / tools
        - label: backend / rules (YAML)
        - label: docs (mvp.md, report-schema.json)

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자 입장에서 무엇이 가능해지는지
      placeholder: 예) 주소를 입력하면 해당 층의 건축물대장 용도를 보여준다
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 할 일
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 이 이슈를 닫을 수 있는지
      placeholder: |
        - USE_MOCK=true 에서도 끝까지 동작한다
        - 데모 시나리오 S1이 기대대로 나온다

  - type: checkboxes
    id: impact
    attributes:
      label: 영향 범위
      options:
        - label: "`docs/report-schema.json` 변경이 필요하다 (프론트·백엔드 담당 모두 확인)"
        - label: 새 외부 API 또는 환경변수가 필요하다 (`.env.example`에 이름 추가)
        - label: 데모 시나리오 S1~S4 결과에 영향이 있다

  - type: input
    id: deadline
    attributes:
      label: 목표 완료일
      placeholder: "예) 2026-11-20 (예선 마감 11-23 17:00)"
