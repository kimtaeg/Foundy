name: "🐛 버그"
description: 동작 오류, 잘못된 판정, 화면 깨짐
title: "[Fix] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        API 키·승인·IP 등록 문제인지, 코드 문제인지 먼저 구분해 주세요.
        브랜치명: `fix/#이슈번호-버그명`

  - type: dropdown
    id: area
    attributes:
      label: 발생 위치
      options:
        - frontend
        - backend / agent
        - backend / tools (외부 API)
        - backend / rules (YAML)
        - 배포 (Vercel / 백엔드 서버)
    validations:
      required: true

  - type: dropdown
    id: cause
    attributes:
      label: 원인 추정
      options:
        - 코드 문제
        - API 키·승인·IP 등록 문제
        - 모르겠음
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 실행 모드
      options:
        - 실제 API
        - USE_MOCK=true
        - 둘 다
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: 입력값
      description: 업종, 주류 판매 여부, 주소(층), 가게 이름, 개업 예정일 등
      placeholder: |
        업종: 카페
        주류: 판매
        주소: 서울시 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 에러 메시지, 로그, 스크린샷, 리포트 JSON 일부
    validations:
      required: true

  - type: checkboxes
    id: severity
    attributes:
      label: 심각도
      options:
        - label: "\"예시로 해보기\"가 끝까지 돌아가지 않는다 (데모 불가)"
        - label: 근거 없이 판정이 나오거나, 판정 값이 3단계 외의 값이다
        - label: 데모 시나리오 S1~S4 중 기대와 다른 결과가 있다
