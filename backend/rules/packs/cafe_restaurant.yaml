# 카페·음식점 규칙 묶음. 새 업종 = 이 파일 하나 추가 (에이전트·도구·API 코드는 바뀌지 않는다).
# TODO(D 담당): 실제 순서·기간과 조문 번호는 사전조사로 확정한 뒤 반영한다.
pack: cafe_restaurant

# 이 규칙 묶음이 받는 업종 입력 (stores.business_type_input). 가게 등록·수정 검증이 같이 쓴다.
# DB CHECK(DB 명세서 2-2)와 같아야 한다.
business_type_inputs: [카페, 음식점]

# 예전 방식(점검 항목별로 조문 번호를 하나씩 지정해 법제처에서 바로 조회). 법령 RAG(law_rag)가 켜져 있으면 쓰지 않는다.
law_references: {}

# ---------------------------------------------------------------------------------------------
# 법령 RAG (설계: docs/AI_모듈_연동_가이드.md, 구현: docs/법령_RAG_구현.md). 법령 원문은 DB에 조문 단위로 저장하고, 조각을 임베딩(pgvector)해 검색한다.
# 법령명은 법제처 현행 법령명 한글과 정확히 같아야 한다 (띄어쓰기·가운뎃점 포함. 표시ㆍ광고는 가운뎃점이 옛 한글 ㆍ(U+318D)다).
# ---------------------------------------------------------------------------------------------
law_sources:
  - 식품위생법
  - 식품위생법 시행령
  - 식품위생법 시행규칙
  - 건축법
  - 건축법 시행령
  - 농수산물의 원산지 표시 등에 관한 법률
  - 식품 등의 표시ㆍ광고에 관한 법률
  - 축산물 위생관리법
  - 근로기준법
  - 최저임금법
  - 국토의 계획 및 이용에 관한 법률
  - 폐기물관리법
  - 하수도법
  - 다중이용업소의 안전관리에 관한 특별법
  - 다중이용업소의 안전관리에 관한 특별법 시행령
  - 소방시설 설치 및 관리에 관한 법률
  - 소방시설 설치 및 관리에 관한 법률 시행령
  - 화재의 예방 및 안전관리에 관한 법률

# 점검 항목별 검색 설정. laws = 검색 범위(메타데이터 필터), keywords = 키워드 검색어, query = 벡터 검색 문장({business_type} 등은 가게 값),
# pins = 검색과 상관없이 항상 넣는 조문, top_k = 검색 결과 조각 수. 읽을 조문이 없으면 점검은 판단 불가로 둔다.
law_rag:
  checks:
    building_use:
      laws: [건축법 시행령, 식품위생법 시행령, 건축법]
      query: "{business_type} 영업을 하는 건물의 용도와 바닥면적 기준 근린생활시설 휴게음식점 일반음식점"
      keywords: [휴게음식점, 일반음식점, 제과점, 근린생활시설]
      top_k: 6
    permit_docs:
      laws: [식품위생법, 식품위생법 시행령, 식품위생법 시행규칙]
      query: "{business_type} 영업신고 서류 위생교육 건강진단 시설기준"
      keywords: [영업신고, 위생교육, 건강진단, 시설기준]
      pins:
        - { law_name: 식품위생법, label: 제36조 }
        - { law_name: 식품위생법, label: 제37조 }
        - { law_name: 식품위생법, label: 제40조 }
        - { law_name: 식품위생법, label: 제41조 }
        - { law_name: 식품위생법 시행령, label: 제25조 }
        - { law_name: 식품위생법 시행규칙, label: 제42조 }
        - { law_name: 식품위생법 시행규칙, label: 제49조 }
      top_k: 3
    labeling:
      laws: [농수산물의 원산지 표시 등에 관한 법률, 식품 등의 표시ㆍ광고에 관한 법률, 식품위생법]
      query: "음식점 원산지 표시 의무 메뉴판 게시"
      keywords: [원산지, 표시]
      pins:
        - { law_name: 농수산물의 원산지 표시 등에 관한 법률, label: 제5조 }
      top_k: 4
    fire_safety:
      laws: [다중이용업소의 안전관리에 관한 특별법, 다중이용업소의 안전관리에 관한 특별법 시행령]
      query: "휴게음식점 일반음식점 영업장 바닥면적 다중이용업 안전시설 완비증명서"
      keywords: [휴게음식점, 일반음식점, 영업장, 바닥면적, 안전시설]
      top_k: 5
    labor_contract:
      laws: [근로기준법, 최저임금법]
      query: "직원 근로계약서 근로조건 명시 최저임금 서면 교부"
      keywords: [근로계약, 근로조건, 서면, 최저임금]
      pins:
        - { law_name: 근로기준법, label: 제17조 }
        - { law_name: 최저임금법, label: 제6조 }
      top_k: 3
  # 조문에서 의무 찾기: 위 점검·아래 적용 규칙이 다루지 않는 의무를 AI가 조문을 읽고 찾는다.
  # 찾은 의무는 인용 문장이 원문에 있어야 점검 카드(확인 권장)와 체크리스트 작업이 된다 (agent/discover.py).
  # queries: 검색 묶음. when = 가게 답변이 참일 때만 검색 (has_employees 등). top_k = 묶음별 조각 수.
  discovery:
    max_items: 6          # 가게 하나에 새로 만드는 의무 최대 개수
    max_articles: 20      # AI에 넘기는 조문 수 (검색 묶음을 번갈아 채운다)
    max_article_chars: 2500  # 조문 하나에서 읽는 최대 글자 수 (별표는 여러 조각을 함께 읽는다)
    group_offsets: { 계약 전: -56, 개업 4주 전: -28, 개업 직전: -7, 개업 후: 7 }  # 작업의 권장 준비일 (개업일 기준)
    check: { stage: 개업 전, contact: gen }  # 찾은 의무 카드의 공통 값
    queries:
      - laws: [식품위생법, 식품위생법 시행령, 식품위생법 시행규칙]
        query: "{business_type} 영업자가 지켜야 할 사항 준수사항 위생 관리 의무"
        keywords: [영업자, 준수사항, 지켜야]
        top_k: 6
      - laws: [식품위생법 시행규칙, 식품위생법]
        query: "{business_type} 영업소 가격표 게시 영업신고증 보관 표시"
        keywords: [가격표, 게시, 영업신고증]
        top_k: 4
      - laws: [폐기물관리법]   # 음식물류 폐기물: 배출자 의무 조문은 검색과 상관없이 항상 넣는다
        query: "음식점 음식물류 폐기물 배출자 신고 처리 의무 사업장 면적"
        keywords: [음식물류 폐기물, 배출자, 생활폐기물]
        pins:
          - { law_name: 폐기물관리법, label: 제15조 }
          - { law_name: 폐기물관리법, label: 제15조의2 }
        top_k: 4
      - laws: [하수도법]
        query: "음식점 영업장 오수 배수설비 개인하수처리시설 설치 의무"
        keywords: [배수설비, 개인하수처리시설, 오수]
        top_k: 4
      - laws: [식품 등의 표시ㆍ광고에 관한 법률]
        query: "음식 메뉴 광고 질병 예방 치료 효능 거짓 과장 광고 금지"
        keywords: [광고, 효능, 금지]
        top_k: 3
      - laws: [축산물 위생관리법]
        query: "축산물 식육 판매 보관 영업자 준수사항 음식점"
        keywords: [식육, 축산물, 준수사항]
        top_k: 3
      - laws: [근로기준법]
        query: "근로자 임금명세서 교부 휴게시간 주휴일 근로자 명부 작성"
        keywords: [임금명세서, 휴게, 주휴일, 근로자 명부]
        top_k: 4
        when: has_employees
      - laws: [식품위생법, 식품위생법 시행규칙]
        query: "청소년에게 주류 제공 금지 일반음식점 주류 판매"
        keywords: [청소년, 주류]
        top_k: 3
        when: sells_alcohol

# 적용 조건 규칙. 코드가 가게 정보로 판정한다 (applies 적용 · not_applicable 미적용 · needs_check 확인 필요).
# conditions 키: business_type · area_sqm · floor · has_employees · sells_alcohol · uses_terrace · does_delivery
#   값이 없으면(null) 확인 필요. 조건은 목록(해당 값 중 하나), {min,max}, {in,not_in}, true/false 로 쓴다.
# exceptions: when 조건에 해당하면 확인 필요로 바꾸고 note 를 보여 준다.
# review_status: draft 는 담당자가 조문과 기준을 아직 확인하지 않았다는 뜻이다. 확정하면 reviewed 로 바꾼다.
# task: 이 규칙이 적용·확인 필요일 때 체크리스트에 만들 작업 (코드가 만든다. AI 아님). 적용 안 함이면 만들지 않는다.
#   template: 기본 체크리스트 항목(checklist)의 id → 새 항목을 만들지 않고 그 항목을 법적 의무로 격상한다
#   id·task·category·group·offset_days·agency·contact: template 이 없을 때 새로 만드는 항목 (offset_days 는 권장 준비일)
#   statutory.basis: 법령이 개업 전 기한을 정한 경우만 적는다 (statutory_deadline = 개업 전날). 없으면 권장 준비일만 표시한다
#   priority: high | normal | low,  task_type: 생략하면 적용+업종 조건뿐이면 legal_obligation, 가게별 조건(면적·직원 등)이 붙으면 conditional
applicability_rules:
  - rule_id: FOOD-REPORT-001
    title: 영업신고 (휴게음식점·일반음식점)
    check_id: permit_docs
    law: { law_name: 식품위생법, label: 제37조 }
    conditions: { business_type: [휴게음식점, 일반음식점] }
    required_action: 관할 구청 위생과에 영업신고
    task: { template: c-04, priority: high, statutory: { basis: 영업을 하려는 자는 신고해야 함 (영업 시작 전) } }
    documents:
      - { id: water_test, name: 수질검사(시험)성적서, type: certificate, applicability: needs_check, agency: 먹는물 수질검사기관,
          guide: "수돗물이 아닌 지하수 등을 먹는 물이나 조리·세척에 쓰는 경우에만 영업신고서에 첨부해요. 수돗물만 쓰면 해당 없음으로 바꿔 주세요 (식품위생법 시행규칙 제42조 제1항 제4호)" }
      - { id: outer_use, name: 외부 장소 사용권 증명 서류, type: kept, when: uses_terrace, agency: 임대인·관리 주체,
          guide: "영업장과 붙어 있는 외부 장소(테라스 등)에서 음식을 제공하려면 그 장소를 쓸 정당한 권한이 있음을 증명하는 서류를 신고서에 첨부해요 (식품위생법 시행규칙 제42조 제1항 제13호)" }
    review_status: draft
  - rule_id: FOOD-FACILITY-001
    title: 영업 시설기준 충족
    check_id: permit_docs
    law: { law_name: 식품위생법, label: 제36조 }
    conditions: { business_type: [휴게음식점, 일반음식점] }
    required_action: 조리장·급수·화장실 등 시설기준 확인
    task: { id: o-facility, task: 영업장 시설기준(조리장·급수·화장실 등) 갖추기, category: 영업 인허가, group: 개업 4주 전, offset_days: -24, agency: 관할 구청 위생과, contact: hyg, priority: high, statutory: { basis: 영업을 하려는 자는 시설기준을 갖춰야 함 (영업 시작 전) } }
    review_status: draft
  - rule_id: FOOD-HEALTH-001
    title: 영업자·종사자 건강진단
    check_id: permit_docs
    law: { law_name: 식품위생법, label: 제40조 }
    conditions: { business_type: [휴게음식점, 일반음식점] }
    required_action: 보건소 등에서 건강진단 받기
    task: { template: c-06, priority: high, statutory: { basis: 영업 시작 전에 미리 건강진단을 받아야 함 (식품위생법 시행규칙 제49조 제2항) } }
    documents:
      - { id: health_cert, name: 건강진단결과서(보건증), type: certificate, agency: 보건소 등 검진기관,
          guide: "식품을 조리·판매하는 일에 직접 종사하는 영업자와 종업원은 영업 시작 전에 건강진단을 받아야 해요. 결과서는 직원 수만큼 필요해요 (식품위생법 시행규칙 제49조)" }
    review_status: draft
  - rule_id: FOOD-EDU-001
    title: 영업 전 위생교육
    check_id: permit_docs
    law: { law_name: 식품위생법, label: 제41조 }
    conditions: { business_type: [휴게음식점, 일반음식점] }
    required_action: 영업 시작 전 위생교육 이수
    task: { template: c-05, priority: high, statutory: { basis: 영업을 하려는 자는 미리 식품위생교육을 받아야 함 (영업 시작 전) } }
    documents:
      - { id: edu_cert, name: 식품위생교육 이수증, type: certificate, agency: 식품위생교육전문기관 · 동업자조합 · 한국식품산업협회,
          guide: "영업을 하려는 자는 미리 식품위생교육을 받아야 해요. 이수증은 영업신고서에 첨부해요. 교육은 식품위생교육전문기관, 동업자조합, 한국식품산업협회에서 해요 (식품위생법 제41조 제2항, 시행규칙 제42조·제51조)" }
    review_status: draft
  - rule_id: ORIGIN-001
    title: 음식점 원산지 표시
    check_id: labeling
    law: { law_name: 농수산물의 원산지 표시 등에 관한 법률, label: 제5조 }
    conditions: { business_type: [휴게음식점, 일반음식점] }
    required_action: 원산지 표시 대상과 표시 방법 확인
    task: { template: c-09, priority: normal }
    review_status: draft
  - rule_id: FIRE-DENSE-001
    title: 다중이용업소 안전시설
    check_id: fire_safety
    law: { law_name: 다중이용업소의 안전관리에 관한 특별법, label: 제2조 }
    conditions: { business_type: [휴게음식점, 일반음식점], area_sqm: { min: 100 } }
    exceptions:
      - when: { floor: { in: [1] } }
        note: 1층(지상과 바로 닿는 층)은 다중이용업 대상에서 빠질 수 있어요. 소방서에 확인해 보세요.
    required_action: 관할 소방서에서 다중이용업 해당 여부와 안전시설 확인
    task: { id: o-fire, task: 다중이용업소 해당 여부와 안전시설 소방서에 확인, category: 건물·시설, group: 개업 4주 전, offset_days: -21, agency: 관할 소방서, contact: gen, priority: normal }
    documents:
      - { id: fire_design, name: 안전시설등 설계도서 (소방서 신고용), type: application, applicability: needs_check, agency: 관할 소방서,
