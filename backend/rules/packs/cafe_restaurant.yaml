# 마이페이지에서 바꾼 필드 → 다시 할 일(run) → 선택을 초기화할 카드(reset). 코드가 정하며 AI는 관여하지 않는다.
# market은 상권 분석을 붙일 때(마지막에 구현) 추가한다.
impacts:
  opening_date: { run: [dates], reset: [] }
  name: { run: [trademark], reset: [trademark_similar] }
  address: { run: [building, law, checklist], reset: [building_use, building_violation, permit_docs] }
  address_detail: { run: [building], reset: [building_use, building_violation] }
  business_type_input: { run: [building, law, checklist], reset: [building_use, building_violation, permit_docs] }
  sells_alcohol: { run: [building, law, checklist], reset: [building_use, building_violation, permit_docs] }
  uses_terrace: { run: [law, checklist], reset: [building_use, permit_docs] }
  area_sqm: { run: [law, checklist], reset: [building_use, fire_safety] }
  does_delivery: { run: [law], reset: [permit_docs] }
  has_employees: { run: [checklist], reset: [] }
  owner_birth_year: { run: [grants], reset: [] }
  funds_krw: { run: [costs], reset: [] }

# 서류함 기본 서류 템플릿: 체크리스트 항목 id별 필요 서류. 서류를 만들어 주지 않고, 어디서 받고 어떻게 관리하는지만 안내한다.
# 서류 항목 필드: id(가게 안에서 같은 서류를 한 번만 만드는 키), name, type, agency, guide, sites, contact, form, applicability, when
#   type: issued(정부 사이트에서 직접 발급) | application(직접 작성해 제출) | certificate(교육·검사로 취득) | kept(작성·계약 후 보관) | reference(확인·조회 자료)
#   form: 법령에 첨부된 공식 서식 { law_name, form_no(법제처 별표번호), title(서식명, 검색어) }. 서식 파일 링크는 법제처 API 로 수집해 law_forms 에 저장한 값만 쓴다 (링크를 여기에 적지 않는다)
#   applicability: 규칙과 상관없이 고정할 적용 상태 (needs_check = 해당 여부를 확인해야 함)
#   when: 가게 값(uses_terrace 등)이 true 일 때만 필요. 값이 비어 있으면 확인 필요, false 면 만들지 않는다
# 링크는 sites의 검증된 공식 사이트 첫 화면만 쓴다. 세부 신청 페이지 주소는 바뀌기 쉬워 쓰지 않는다.
# 법령 규칙(applicability_rules)에 붙은 documents 는 그 규칙이 적용·확인 필요일 때 같은 형식으로 서류함에 더해진다.
documents:
  c-01:
    - { id: bldg, name: 건축물대장 (일반·집합), type: issued, agency: 정부24 · 세움터, sites: [gov24, eais],
        guide: "정부24에서 “건축물대장 열람/발급”을 검색하거나, 세움터의 건축물대장 발급·열람 메뉴에서 주소로 조회해요. 발급받은 파일은 서류함에 올려 두세요" }
  c-02:
    - { id: tm, name: 상표 검색 결과, type: reference, agency: KIPRIS, sites: [kipris],
        guide: "KIPRIS에서 상표 검색 → 가게 이름을 넣고 유사 상표의 지정 서비스(제43류)를 확인해요. 검색 결과 화면을 저장해 두면 좋아요" }
  c-03:
    - { id: bizapply, name: 사업자등록 신청, type: application, agency: 홈택스, sites: [hometax],
        guide: "홈택스 로그인 → 신청/제출 → 사업자등록 신청 (영업신고증 사본 첨부)" }
  c-04:
    - { id: apply, name: 영업신고서 (식품위생법 시행규칙 별지 제37호서식), type: application, agency: 정부24 · 관할 구청 위생과,
        sites: [gov24], contact: hyg, form: { law_name: 식품위생법 시행규칙, form_no: "003700", title: 식품 영업 신고서 },
        guide: "영업에 필요한 시설을 갖춘 뒤 영업신고서에 교육이수증 등을 첨부해 신고관청(구청 위생과)에 제출해요. 정부24에서 전자로 신고할 수도 있어요" }
  c-07:
    - { id: signapply, name: 옥외광고물 신고·허가 안내, type: reference, agency: 정부24 · 관할 구청, sites: [gov24], contact: build,
        guide: "정부24에서 “옥외광고물”을 검색하고, 신고·허가 대상인지 관할 구청에 확인하세요" }
  c-08:
    - { id: contract, name: 표준 근로계약서, type: kept, agency: 고용노동부, sites: [moel],
        guide: "고용노동부 누리집의 자료실·정책자료에서 “표준근로계약서”를 찾아 받아 직원과 서면으로 작성하고, 한 부씩 나눠 가진 뒤 보관해요" }
    - { id: insure, name: 4대보험 취득 신고, type: application, agency: 4대사회보험 정보연계센터, sites: [insure],
        guide: "근로자를 고용하면 4대사회보험 정보연계센터에서 취득 신고를 해요" }
  c-09:
    - { id: label, name: 원산지·가격 표시 안내, type: reference, agency: 국립농산물품질관리원, sites: [naqs],
        guide: 원산지 표시 대상과 방법은 국립농산물품질관리원 안내를 확인하세요 }
  x-0:
    - { id: bldg0, name: 후보 자리 건축물대장, type: issued, agency: 정부24 · 세움터, sites: [gov24, eais],
        guide: 후보 주소의 건축물대장에서 해당 층 용도를 확인해요 }
  x-2:
    - { id: tm2, name: 상표 최종 확인, type: reference, agency: KIPRIS, sites: [kipris],
        guide: 간판 제작 전에 KIPRIS에서 다시 검색해요 }

