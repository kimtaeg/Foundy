# 카페·음식점 규칙 묶음. 새 업종 = 이 파일 하나 추가 (에이전트·도구·API 코드는 바뀌지 않는다).
# TODO(D 담당): 실제 순서·기간과 조문 번호는 사전조사로 확정한 뒤 반영한다.
pack: cafe_restaurant

# 되물을 후보. AI가 이 중에서 지금 필요한 것만 고른다.
ask:
  - id: sells_alcohol
    text: 술도 판매하시나요?
    type: boolean
    required: true   # 신고 업종을 정하므로 AI가 건너뛸 수 없다
    why: 술을 팔면 신고 업종이 휴게음식점에서 일반음식점으로 바뀝니다.
  - id: uses_terrace
    text: 테라스나 가게 앞 공간을 쓰시나요?
    type: boolean
    why: 옥외 영업은 별도 확인이 필요합니다.
  - id: has_employees
    text: 직원을 고용하시나요?
    type: boolean
    why: 직원이 있으면 근로계약·4대보험 일정이 생깁니다.
  - id: funds_krw
    text: 준비된 자금은 얼마인가요?
    type: number
    optional: true
    why: 지원사업 안내와 매물 비교의 버틸 수 있는 기간 계산에 씁니다.

# 규칙으로 정하는 값 (AI가 판단하지 않는다)
derive:
  business_type:
    key: sells_alcohol
    "true": 일반음식점
    "false": 휴게음식점

# 건물 용도 적합 여부 (건축법 시행령 별표 1 기준, TODO: D 담당이 조문 확인)
# - 신고 업종마다 허용되는 용도. 허용 목록에 없고 known_uses 안이면 high.
# - known_uses 밖의 용도(판매시설, 업무시설 등)는 규칙으로 단정하지 않고 unknown.
building_use:
  known_uses: [제1종근린생활시설, 제2종근린생활시설]
  allowed:
    일반음식점: [제2종근린생활시설]
    휴게음식점: [제1종근린생활시설, 제2종근린생활시설]

# 점검 리포트 항목. remedies=선택지로 만들 수 있는 대응 유형, drafts=대신 만들 초안 유형
checks:
  - id: building_use
    stage: 계약 전
    decided_by: rule
    remedies: [change_business_type, change_site, request_use_change]
    drafts: [inquiry_message, contract_clause]
    checklist_task: 건물 확인·임대차 계약   # 이 항목이 걸리면 연결되는 체크리스트 기본 항목
    titles:
      high: "이 자리에서는 {business_type} 신고가 어려워요"
      ok: "이 건물에서 {business_type} 신고가 가능해요"
      unknown: "건물 용도를 확인할 수 없어요"
  - id: building_violation
    stage: 계약 전
    decided_by: rule
    remedies: []
    drafts: [inquiry_message]
    checklist_task: 건물 확인·임대차 계약
    titles:
      high: "위반건축물로 표기된 건물이에요"
      ok: "위반건축물 표기가 없어요"
      unknown: "위반건축물인지 확인할 수 없어요"
  - id: alcohol_vs_type
    stage: 개업 전
    decided_by: rule
    remedies: [change_business_type]
    drafts: []
    titles:
      ok: "일반음식점으로 신고하면 술을 팔 수 있어요"
  - id: trademark_similar
    stage: 계약 전
    decided_by: ai
    remedies: [rename_store, proceed]
    drafts: []
  - id: ad_claims
    stage: 개업 전
    decided_by: ai
    remedies: [rewrite_copy]
    drafts: []

# 개업 체크리스트 기본 항목. week는 개업일 기준 주 단위 (음수=개업 전), 날짜는 계산 도구가 계산한다.
checklist:
  - { task: 건물 확인·임대차 계약, category: 건물·시설, week: -8 }
  - { task: 위생교육 신청, category: 영업 인허가, week: -6 }
  - { task: 건강진단, category: 영업 인허가, week: -5 }
  - { task: 영업신고, category: 영업 인허가, week: -4 }
  - { task: 사업자등록, category: 세무, week: -3 }
  - { task: 간판 신고·카드 단말기, category: 간판·광고, week: -2 }
  - { task: 근로계약서·4대보험, category: 고용, week: -1, when: has_employees }
