# 임대료 비교: 가게 주소 → 한국부동산원 상업용부동산 임대동향조사 상권 이름(CLS_FULLNM).
# 통계표마다 CLS_ID가 달라서(예: 홍대/합정이 소규모 상가 표 520029, 집합 상가 표 520024) ID가 아니라 이름으로 매칭한다.
# 위에서부터 먼저 맞는 규칙을 쓴다. 상권에 없으면 권역(region) → 시도(sido) 순으로 넓혀 찾는다.
# 확인 기준: R-ONE "임대동향 지역별 임대료(2026년3분기~)_소규모 상가" 2026년 3분기 row.
areas:
  # 성수동 일대는 통계상 '뚝섬' 상권이다 (성수라는 상권 이름은 없다)
  - match: ["성수동1가", "성수동2가", "성수동", "성수이로", "성수일로", "뚝섬로", "아차산로", "연무장"]
    district: 성동구
    area: "서울>기타>뚝섬"
  - match: ["연남동", "동교동"]
    district: 마포구
    area: "서울>영등포신촌>동교/연남"
  - match: ["망원동", "망원로"]
    district: 마포구
    area: "서울>영등포신촌>망원역"
  - match: ["서교동", "합정동", "홍익로", "와우산로", "양화로"]
    district: 마포구
    area: "서울>영등포신촌>홍대/합정"
  - match: ["공덕동", "마포대로"]
    district: 마포구
    area: "서울>영등포신촌>공덕역"
  - match: ["신촌로", "창천동", "대현동", "이화여대"]
    district: 서대문구
    area: "서울>영등포신촌>신촌/이대"
  - match: ["행당동", "왕십리"]
    district: 성동구
    area: "서울>기타>왕십리"
  - match: ["화양동", "자양동", "건대입구"]
    district: 광진구
    area: "서울>기타>건대입구"
  - match: ["이태원동", "이태원로"]
    district: 용산구
    area: "서울>기타>이태원"
# 상권에 없을 때 쓰는 권역 (자치구 → 권역 이름)
regions:
  마포구: "서울>영등포신촌"
  영등포구: "서울>영등포신촌"
  서대문구: "서울>영등포신촌"
  종로구: "서울>도심"
  중구: "서울>도심"
  강남구: "서울>강남"
  서초구: "서울>강남"
# 시도 (주소 첫 단어 → 통계의 시도 이름). 통계의 시도 행은 CLS_NM이 이 이름이다
sido:
  서울특별시: 서울
  서울: 서울
  부산광역시: 부산
  부산: 부산
  대구광역시: 대구
  대구: 대구
  인천광역시: 인천
  인천: 인천
  광주광역시: 광주
  광주: 광주
  대전광역시: 대전
  대전: 대전
  울산광역시: 울산
  울산: 울산
  세종특별자치시: 세종
  세종: 세종
  경기도: 경기
  경기: 경기
  강원특별자치도: 강원
  강원도: 강원
  강원: 강원
  충청북도: 충북
  충북: 충북
  충청남도: 충남
  충남: 충남
  전북특별자치도: 전북
  전라북도: 전북
  전북: 전북
  전라남도: 전남
  전남: 전남
  경상북도: 경북
  경북: 경북
  경상남도: 경남
  경남: 경남
  제주특별자치도: 제주
  제주: 제주
